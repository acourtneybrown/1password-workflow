name: Alfred Workflow Release

on:
  push:
    tags: ["*"]

env:
  WORKFLOW_NAME: ${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Build .alfredworkflow
        run: |
          cd Workflow
          zip --recurse-paths --symlinks "../${{ env.WORKFLOW_NAME }}.alfredworkflow" .

      - name: Create release notes
        id: release_notes
        uses: mikepenz/release-changelog-builder-action@v6.4.0
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          platform: "gitea"
          mode: "COMMIT"
          baseUrl: ${{ gitea.server_url }}
          configurationJson: |
            {
              "label_extractor": [{
                "pattern": "^(\\w+)(\\([\\w\\-\\.]+\\))?(!)?: .+",
                "on_property": "title",
                "target": "$1"
              }],
              "categories": [
                { "title": "## ⚠️ Breaking changes", "labels": ["break"] },
                { "title": "## 🚀 New features", "labels": ["feat", "improv"] },
                { "title": "## 🛠️ Fixes", "labels": ["fix", "perf", "chore"] },
                { "title": "## 👾 Other", "labels": [] }
              ],
              "ignore_labels": ["release", "bump"]
            }

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: ${{ steps.release_notes.outputs.changelog }}
          files: ${{ env.WORKFLOW_NAME }}.alfredworkflow

      - name: Install GitHub CLI
        if: ${{ secrets.GH_TOKEN != '' }}
        run: |
          (type -p wget >/dev/null || (sudo apt update && sudo apt install wget -y)) \
          && sudo mkdir -p -m 755 /etc/apt/keyrings \
          && out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg \
          && cat $out | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
          && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
          && sudo mkdir -p -m 755 /etc/apt/sources.list.d \
          && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
          && sudo apt update \
          && sudo apt install gh -y

      - name: Create GitHub release
        if: ${{ secrets.GH_TOKEN != '' }}
        run: |
          gh release create ${{ github.ref_name }} \
            --repo ${{ gitea.repository }} \
            --title ${{ github.ref_name }} \
            --notes '${{ steps.release_notes.outputs.changelog }}' \
            ./*.alfredworkflow
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
